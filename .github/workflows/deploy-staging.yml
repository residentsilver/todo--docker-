# ステージング環境へのデプロイワークフロー
# stagingブランチへのpush時に自動的にビルド→デプロイを実行します

name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  # バックエンドのデプロイ
  deploy-backend:
    name: バックエンドをステージングにデプロイ
    runs-on: ubuntu-latest

    steps:
      # リポジトリのチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # SSHキーのセットアップ
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      # known_hostsの追加
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p ${{ secrets.STAGING_PORT }} -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>&1 || echo "Warning: ssh-keyscan failed, but continuing..."
          chmod 644 ~/.ssh/known_hosts

      # SSH接続のテスト
      - name: Test SSH connection
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          echo "Testing SSH connection..."
          ssh -p STAGING_PORT -o ConnectTimeout=10 -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "echo 'SSH connection successful'" || echo "SSH connection failed"

      # ステージングサーバーへのデプロイ
      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_BACKEND_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_BACKEND_SCRIPT_PATH: ${{ secrets.STAGING_BACKEND_PATH }}
        run: |
          # デプロイスクリプトの実行
          ssh -p $STAGING_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_BACKEND_SCRIPT_PATH && bash deploy-backend.sh"

      # デプロイ通知（オプション）
      - name: Notify deployment
        if: always()
        run: |
          echo "Backend deployment to staging completed with status: ${{ job.status }}"

  # フロントエンドのビルドとデプロイ
  deploy-frontend:
    name: フロントエンドをステージングにデプロイ
    runs-on: ubuntu-latest

    steps:
      # リポジトリのチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # npm依存関係のインストール
      - name: Install dependencies
        working-directory: ./todo-app/frontend/todo
        run: npm ci

      # ステージング用のビルド
      - name: Build for staging
        working-directory: ./todo-app/frontend/todo
        env:
          REACT_APP_API_URL: ${{ secrets.STAGING_API_URL }}
          REACT_APP_ENV: staging
          CI: false
        run: npm run build

      # SSHキーのセットアップ
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      # known_hostsの追加
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p ${{ secrets.STAGING_PORT }} -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>&1 || echo "Warning: ssh-keyscan failed, but continuing..."
          chmod 644 ~/.ssh/known_hosts

      # ステージングサーバーへのデプロイ
      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_FRONTEND_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
        run: |
          # ビルドファイルをサーバーに転送
          rsync -avz --delete -e "ssh -p $STAGING_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no" \
            todo-app/frontend/todo/build/ \
            $STAGING_USER@$STAGING_HOST:$STAGING_PATH/

      # デプロイ通知（オプション）
      - name: Notify deployment
        if: always()
        run: |
          echo "Frontend deployment to staging completed with status: ${{ job.status }}"

